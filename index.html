body{background:#000;overflow-x:hidden;min-height:100vh;color:#fff}

.name span{display:inline-block;opacity:0;transform:translateY(100px) rotateX(-90deg) scale(.5);filter:blur(12px);transition:1.1s cubic-bezier(.16,1,.3,1)}
.name span.show{opacity:1;transform:none;filter:blur(0)}
.dash{font-size:36px;color:#ff2a6d;text-shadow:0 0 30px #ff2a6d;opacity:0;transition:1s 1.2s}.dash.show{opacity:1}

    document.body.style.overflowY='auto';

    const io=new IntersectionObserver((entries)=>{
      entries.forEach(e=>{if(e.isIntersecting)e.target.classList.add('show')});

    cards.forEach(c=>io.observe(c));
